name: Feature request
description: Suggest an idea for RaktSetu.
title: "feat: "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Please check [docs/ROADMAP.md](../../blob/main/docs/ROADMAP.md) first — your idea might already be planned for a later phase.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who runs into this, and when?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: This doesn't conflict with any of the six privacy principles in docs/PRIVACY.md.
          required: true
